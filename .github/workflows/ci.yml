name: CI

# 无构建步骤（client.js 就是源），所以 CI 只做三件事：
#   1. 语法检查
#   2. 跑全部测试（对比度 + 色相扫描 + 无头客户端）
#   3. 校验发行清单与仓库事实一致
#
# 注意：**没有** `git diff --exit-code` 那一步 —— 那是给「lib/ 是构建产物」
# 的项目防漂移用的（如 dsh-550c-boot）。我们即源即产物，不需要。

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 零运行时依赖，但对比度自检与无头测试都是纯 Node，无需 install。
      # 保留这一步是为了将来万一加 devDependency 时不会静默跳过。
      - name: Install (no-op when there are no dependencies)
        run: |
          if [ -f package-lock.json ]; then npm ci; else echo "no lockfile, skipping"; fi

      - name: Syntax check
        run: npm run check

      - name: Contrast + accent-hue sweep
        run: npm run contrast

      # 生成器一致性（0.10.0 补进 CI）。
      #
      # 这条守护的是「壁纸目录 ↔ client.js 副本」的一致性：client.js 不能
      # import src/，所以壁纸清单是**生成的副本**。它抓过真实事故 ——
      # 0.9.1 那次生成器用 JSON.stringify 写标签，产出双引号字符串，
      # 与 client.js 全文件的单引号风格分叉。
      #
      # ⚠️ 放在无头测试**之前**：它只要 1 秒，失败得更快。
      - name: Generated blocks in sync
        run: node tools/gen-wallpapers.mjs --check

      - name: Headless client tests
        run: node tools/test-client.mjs

      - name: Manifest self-check
        run: node tools/check-manifest.mjs
