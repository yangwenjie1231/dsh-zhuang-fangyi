# ⚠️ 本文件**不在** `.github/workflows/` 下 —— 故意如此。
#
# 原因：推送 CI 文件需要 GitHub token 具备 `workflow` scope，而本机 gh 登录的
# token 只有 `gist, read:org, repo`。GitHub 会直接拒绝推送：
#   refusing to allow an OAuth App to create or update workflow
#   `.github/workflows/ci.yml` without `workflow` scope
#
# 启用方式（任选其一）：
#   1. 拿到 workflow scope 后把本文件移到 .github/workflows/ci.yml：
#        gh auth refresh -h github.com -s workflow      # 需浏览器授权
#        mkdir .github/workflows
#        git mv docs/ci/ci.yml .github/workflows/ci.yml
#        git commit -m "ci: 启用 GitHub Actions" && git push
#   2. 用网页版 GitHub 手动新建 .github/workflows/ci.yml，内容粘贴本文件
#      （网页操作不受 token scope 限制）
#
# 内容本身是可直接用的，无需修改。

name: CI

# 无构建步骤（client.js 就是源），所以 CI 只做三件事：
#   1. 语法检查
#   2. 跑全部测试（对比度 + 色相扫描 + 无头客户端）
#   3. 校验发行清单与仓库事实一致
#
# 注意：**没有** `git diff --exit-code` 那一步 —— 那是给「lib/ 是构建产物」
# 的项目防漂移用的（如 dsh-550c-boot）。我们即源即产物，不需要。

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 零运行时依赖，但对比度自检与无头测试都是纯 Node，无需 install。
      # 保留这一步是为了将来万一加 devDependency 时不会静默跳过。
      - name: Install (no-op when there are no dependencies)
        run: |
          if [ -f package-lock.json ]; then npm ci; else echo "no lockfile, skipping"; fi

      - name: Syntax check
        run: npm run check

      - name: Contrast + accent-hue sweep
        run: npm run contrast

      - name: Headless client tests
        run: node tools/test-client.mjs

      - name: Manifest self-check
        run: node tools/check-manifest.mjs
